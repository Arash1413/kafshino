{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوتیک زنانه | کفشینو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face { font-family: 'Vazir'; src: url('https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.woff2'); }
        body { font-family: 'Vazir', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- هدر سایت (مشابه تصویر) -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 p-4 shadow-sm">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-2xl font-black text-gray-800">کفشینو</div>
            <nav>
                <ul class="flex gap-8 text-gray-600 font-medium">
                    <li class="hover:text-black cursor-pointer">خانه</li>
                    <li class="hover:text-black cursor-pointer text-black border-b-2 border-black">فروشگاه</li>
                    <li class="hover:text-black cursor-pointer">درباره ما</li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- بخش بنر اصلی (جایگزین بخش قبلی) -->
    <section class="container mx-auto mt-8 px-4">
        <div class="relative w-full overflow-hidden rounded-[40px] shadow-2xl">
            <!-- نمایش تصویر بنر -->
            <img src="{% static 'shop/images/banner.jpg' %}" alt="کفشینو بنر" class="w-full h-auto object-cover">
            
            <!-- اگر می‌خواهی دکمه "مشاهده محصولات" روی عکس فعال باشد، از کد زیر استفاده کن -->
            <a href="#" class="absolute bottom-[20%] left-[12%] bg-black text-white px-8 py-3 rounded-full font-bold hover:scale-105 transition-transform hidden md:block">
                مشاهده محصولات
            </a>
        </div>
    </section>

    <!-- نمایش محصولات ویژه -->
    <main class="container mx-auto py-16 px-4">
        <h2 class="text-3xl font-black mb-10 text-center text-gray-800">محصولات ویژه</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            {% for product in products %}
            <div class="group bg-white p-4 rounded-[30px] shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100">
                <div class="overflow-hidden rounded-[20px] mb-4">
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-64 object-cover group-hover:scale-110 transition-duration-500">
                </div>
                <h3 class="font-bold text-lg text-gray-800">{{ product.name }}</h3>
                <div class="flex justify-between items-center mt-4">
                    <span class="text-green-600 font-bold">{{ product.price }} تومان</span>
                    <button class="bg-gray-100 p-2 rounded-full hover:bg-black hover:text-white transition">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1zm3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4h-3.5z"/>
                        </svg>
                    </button>
                </div>
            </div>
            {% empty %}
            <p class="text-center col-span-4 text-gray-500">هنوز محصولی اضافه نشده است. از پنل ادمین اضافه کنید.</p>
            {% endfor %}
        </div>
    </main>

</body>
</html>
