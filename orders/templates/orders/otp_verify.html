{% extends "shop/base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-20 flex justify-center">
    <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-xl p-10 text-center border border-gray-50">
        <div class="w-16 h-16 bg-[#428e91]/10 text-[#428e91] rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
        </div>
        
        <h2 class="text-2xl font-black mb-2">تایید شماره موبایل</h2>
        <p class="text-gray-500 text-sm mb-8">کد ۵ رقمی ارسال شده به موبایل خود را وارد کنید.</p>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <input type="text" name="otp_code" maxlength="5" placeholder="- - - - -" 
                   class="w-full text-center text-3xl tracking-[1rem] py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none focus:border-[#428e91] transition-all font-black">
            
            {% if error %}
                <p class="text-red-500 text-xs font-bold">{{ error }}</p>
            {% endif %}

            <button type="submit" class="w-full bg-black text-white py-4 rounded-2xl font-black text-lg hover:bg-[#428e91] transition shadow-lg">
                تایید و ادامه خرید
            </button>
        </form>
    </div>
</div>
{% endblock %}
