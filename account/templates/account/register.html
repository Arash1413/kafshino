{% extends "shop/base.html" %}

{% block title %}ثبت‌نام در کفشینو{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 flex justify-center">
    <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-xl p-10 border border-gray-50">
        <h2 class="text-3xl font-black text-center mb-8 text-gray-800">ایجاد حساب کاربری</h2>
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1 mr-2">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-red-500 text-[10px] mt-1 mr-2">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            
            <button type="submit" class="w-full bg-black text-white py-4 rounded-2xl font-black text-lg hover:bg-[#428e91] transition shadow-lg mt-4">
                ثبت‌نام در کفشینو
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500">
            قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'account:login' %}" class="text-[#428e91] font-bold">وارد شوید</a>
        </div>
    </div>
</div>

<style>
    input {
        width: 100%;
        padding: 0.8rem 1rem;
        background: #f9fafb;
        border: 2px solid #f3f4f6;
        border-radius: 1rem;
        outline: none;
        transition: all 0.3s;
        text-align: right;
    }
    input:focus { border-color: #428e91; background: white; }
</style>
{% endblock %}
